services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dihastro/mlops-final-task:latest
    container_name: mlops-final-task
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
