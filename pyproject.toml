[tool.poetry]
name = "veins-segmentation"
version = "0.1.0"
description = "Retinal vessel segmentation (UNet++ + WCD)"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

packages = [
    { include = "common",  from = "src/ml" },
    { include = "models",  from = "src/ml" },
    { include = "dataset", from = "src/ml" },
    { include = "web",     from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"

# --- PyTorch (CUDA 13.0) ---
torch = { version = "2.10.0", source = "pytorch-cu130" }
torchvision = { version = "0.25.0", source = "pytorch-cu130" }

# --- ML / CV ---
segmentation-models-pytorch = "^0.5"
numpy = "^2.0"
pandas = "2.3.3"
scipy = "1.15.3"
scikit-learn = "1.8.0"
albumentations = "^2.0"
opencv-python = "^4.12"
pillow = "^12.0"
tqdm = "^4.67"

# --- Web ---
fastapi = "^0.136"
pydantic = "^2.10"
uvicorn = "^0.34"
httpx = "^0.27"

# --- Data versioning ---
dvc = { version = "^3.0", extras = ["s3"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pylint = "^4.0"

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
